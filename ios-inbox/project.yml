# Proyecto de la app nativa de chat (Cloud API de WhatsApp).
# El .xcodeproj NO se versiona: se regenera con `xcodegen generate` en esta carpeta.
# Firebase entra por Swift Package Manager (sin CocoaPods, sin bug de locale).
name: CobrifyInbox
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
targets:
  CobrifyInbox:
    type: application
    platform: iOS
    sources:
      - CobrifyInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobrify.inbox
        DEVELOPMENT_TEAM: WAUWHRT3D6
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 31
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: CobrifyInbox/CobrifyInbox.entitlements
      properties:
        aps-environment: development
    info:
      path: CobrifyInbox/Info.plist
      properties:
        # Atadas a los ajustes del proyecto: sin esto xcodegen reescribe el
        # Info.plist con sus valores por defecto (1 / 1.0) cada vez que cambia
        # una propiedad, y el build sube con el numero equivocado.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Cobrify Chat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Para grabar y enviar notas de voz en el chat.
        NSCameraUsageDescription: Para tomar una foto y enviarla en el chat.
        NSPhotoLibraryAddUsageDescription: Para guardar en tu carrete las fotos del chat.
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
